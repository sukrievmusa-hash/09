/* ===== утилиты ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64u=b=>{let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const KEYS=['t','l','n','d','h','p','a','m','o','w','x','s'];
const pack=d=>b64u(new TextEncoder().encode(JSON.stringify(KEYS.map(k=>d[k]??''))));
function unpack(s){const a=JSON.parse(new TextDecoder().decode(ub64(s)));if(!Array.isArray(a))throw 0;const d={};KEYS.forEach((k,i)=>d[k]=a[i]??'');
 d.t=Math.min(5,Math.max(0,+d.t||0));d.s=Math.min(3,Math.max(0,+d.s||0));d.l=d.l==='ru'?'ru':'kk';return d}
async function verify(data,sig){try{const k=await crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
 return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,ub64(sig),new TextEncoder().encode(data))}catch(e){return false}}
const phone=s=>{let d=String(s||'').replace(/\D/g,'');if(d.length===11&&d[0]==='8')d='7'+d.slice(1);if(d.length===10)d='7'+d;return d.length===11?d:''};
const safeUrl=u=>/^https?:\/\/[^\s"'<>]+$/i.test(u||'')?u:'';
const baseUrl=()=>location.href.split('#')[0];
const when=d=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(d.d||''),t=/^(\d\d):(\d\d)$/.exec(d.h||'')||[0,'18','00'];return m?new Date(+m[1],m[2]-1,+m[3],+t[1],+t[2]):null};

/* ===== отрисовка приглашения ===== */
let timers=[];
function render(el,d,o={}){
 const L=T[d.l],dt=when(d),paid=!!o.paid,link=o.link||'';
 const txt=(d.x||'').trim()||L.text(L.what[d.t]);
 const map=safeUrl(d.m),wa=phone(d.w);
 const p2=n=>String(n).padStart(2,'0');
 let cal='';
 if(dt){const f=x=>x.getFullYear()+p2(x.getMonth()+1)+p2(x.getDate())+'T'+p2(x.getHours())+p2(x.getMinutes())+'00',e=new Date(+dt+4*36e5);
  cal='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(L.kinds[d.t]+': '+d.n)+'&dates='+f(dt)+'/'+f(e)+'&ctz=Asia/Almaty&location='+encodeURIComponent([d.p,d.a].filter(Boolean).join(', '))}
 const dateLine=dt?`${dt.getDate()} ${L.months[dt.getMonth()]} ${dt.getFullYear()}`:'';
 el.innerHTML=`<div class="inv s${d.s}" lang="${d.l}">
 ${paid?'':'<div class="wm"></div>'}
 ${o.cover?`<div class="cover" data-cover>${ORN}<div class="kind" style="margin-top:18px">${esc(L.kinds[d.t])}</div><div class="names">${esc(d.n)}</div><div class="cdate">${esc(dateLine)}</div><button class="ib" type="button" data-open>${L.open}</button></div>`:''}
 <div data-body ${o.cover?'hidden':''}>
 <div class="in">
  <div class="sec rv" style="padding-top:54px">${ORN}<div class="kind" style="margin-top:20px">${esc(L.kinds[d.t])}</div><div class="names">${esc(d.n)}</div><p class="txt">${esc(txt)}</p></div>
  ${dt?`<div class="sec rv"><div class="frame"><div class="lbl">${L.date}</div><div class="day">${dt.getDate()}</div><div class="my">${L.months[dt.getMonth()]} ${dt.getFullYear()}</div><div class="wd">${L.days[dt.getDay()]}</div><div class="time">${L.start}: ${esc(d.h)}</div></div></div>
  <div class="sec rv"><div class="lbl">${L.left}</div><div class="cd" data-cd></div></div>`:''}
  ${d.p?`<div class="sec rv">${ORN}<div class="lbl" style="margin-top:18px">${L.where}</div><div class="place">${esc(d.p)}</div><div class="addr">${esc(d.a)}</div>${map?`<a class="ib" href="${esc(map)}" target="_blank" rel="noopener">${L.map}</a>`:''}</div>`:''}
  ${d.o?`<div class="sec rv"><div class="lbl">${L.hosts}</div><div class="hosts">${esc(d.o)}</div></div>`:''}
  ${wa?`<div class="sec rv"><div class="frame"><div class="lbl">${L.rsvp}</div><div class="rsvp">
    <input data-gn placeholder="${L.name}" maxlength="50" aria-label="${L.name}">
    <select data-gc aria-label="${L.cnt}">${[1,2,3,4,5,6].map(n=>`<option value="${n}">${L.cnt}: ${n}</option>`).join('')}</select>
    ${paid?`<div class="two"><a class="ib" data-yes target="_blank" rel="noopener">${L.yes}</a><a class="ib line" data-no target="_blank" rel="noopener">${L.no}</a></div>`
     :`<div class="two"><span class="ib" style="opacity:.45">${L.yes}</span><span class="ib line" style="opacity:.45">${L.no}</span></div><p class="note">${L.rsvpDemo}</p>`}
   </div></div></div>`:''}
  ${cal?`<div class="sec rv" style="padding-top:6px"><a class="ib line" href="${esc(cal)}" target="_blank" rel="noopener">${L.cal}</a></div>`:''}
  <div class="made">${L.made} <a href="${esc(baseUrl())}" data-home>${L.make}</a></div>
 </div>
 ${paid?'':`<div class="pay"><span>${L.demo}</span><a href="https://wa.me/${SELLER_WA}?text=${encodeURIComponent(L.payMsg(link))}" target="_blank" rel="noopener">${L.pay}</a></div>`}
 </div></div>`;
 const root=el.firstElementChild,body=root.querySelector('[data-body]');
 const reveal=()=>{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{root:o.scroller||null,threshold:.12});
  root.querySelectorAll('.rv').forEach(x=>o.instant?x.classList.add('on'):io.observe(x))};
 const ob=root.querySelector('[data-open]');
 if(ob)ob.onclick=()=>{root.querySelector('[data-cover]').hidden=true;body.hidden=false;scrollTo(0,0);reveal()};else reveal();
 const cd=root.querySelector('[data-cd]');
 if(cd){const tick=()=>{let s=Math.floor((dt-Date.now())/1000);if(s<=0){cd.outerHTML=`<p class="txt">${L.passed}</p>`;return false}
   const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];cd.innerHTML=v.map((x,i)=>`<div><b>${x}</b><span>${L.u[i]}</span></div>`).join('');return true};
  if(tick()){const id=setInterval(()=>{if(!cd.isConnected||!tick())clearInterval(id)},1000);timers.push(id)}}
 if(paid&&wa){const gn=root.querySelector('[data-gn]'),gc=root.querySelector('[data-gc]'),y=root.querySelector('[data-yes]'),n=root.querySelector('[data-no]');
  const up=()=>{const nm=gn.value.trim()||'—';y.href=`https://wa.me/${wa}?text=`+encodeURIComponent(L.mYes(nm,gc.value));n.href=`https://wa.me/${wa}?text=`+encodeURIComponent(L.mNo(nm))};
  gn.oninput=gc.onchange=up;up()}
 const hm=root.querySelector('[data-home]');if(hm&&o.onHome)hm.onclick=e=>{e.preventDefault();o.onHome()};
}

 render($('#prev'),d,{instant:true});render($('#heroPrev'),d,{instant:true})}

 $('#styles').innerHTML=STYLES.map((s,i)=>`<button type="button" data-s="${i}"><i style="background:linear-gradient(135deg,${s[1]} 50%,${s[2]} 50%)"></i>${s[0]}</button>`).join('');
 const mark=()=>document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===style));mark();
 $('#styles').onclick=e=>{const b=e.target.closest('[data-s]');if(b){style=+b.dataset.s;mark();preview();$('#out').hidden=true}};

 /* примерные значения стираются при первом касании поля */
 ['n','p','a','o'].forEach(k=>f[k].addEventListener('focus',()=>{if(!touched[k]){touched[k]=1;f[k].value='';preview()}}));

  $('#link').value=link;$('#payBtn').href='https://wa.me/'+SELLER_WA+'?text='+encodeURIComponent(T[ui].payMsg(link));
  $('#out').hidden=false;$('#out').scrollIntoView({behavior:'smooth',block:'center'})};
 $('#copy').onclick=async()=>{const i=$('#link');try{await navigator.clipboard.writeText(i.value)}catch(e){i.focus();i.select();try{document.execCommand('copy')}catch(_){}}
  $('#copy').textContent=UI[ui].oCopied;setTimeout(()=>$('#copy').textContent=UI[ui].oCopy,1600)};
 $('#open').onclick=()=>{showInvite(cur.d,false,cur.link);try{history.pushState(null,'','#i='+pack(cur.d))}catch(e){}};
 document.querySelectorAll('[data-ui]').forEach(b=>b.onclick=()=>{ui=b.dataset.ui;try{localStorage.setItem('toiga-ui',ui)}catch(e){}applyUI();
  if(!Object.keys(touched).length){f.l.value=ui}preview()});
}
let cur=null;
function showHome(){timers.forEach(clearInterval);timers=[];$('#view-inv').hidden=true;$('#view-inv').innerHTML='';$('#view-home').hidden=false;preview();scrollTo(0,0)}
function showInvite(d,paid,link){timers.forEach(clearInterval);timers=[];$('#view-home').hidden=true;const v=$('#view-inv');v.hidden=false;
 render(v,d,{cover:true,paid,link,onHome:()=>{try{history.pushState(null,'','#')}catch(e){}showHome()}});
 document.title=T[d.l].kinds[d.t]+' — '+d.n;scrollTo(0,0)}
async function route(){
 const m=/[#&]i=([\w-]+)(?:&s=([\w-]+))?/.exec(location.hash);
 if(!m){if(!$('#view-inv').hidden)showHome();return}
 let d;try{d=unpack(m[1])}catch(e){showHome();return}
 const paid=m[2]?await verify(m[1],m[2]):false;
 showInvite(d,paid,location.href);
}
applyUI();initForm();preview();route();
addEventListener('hashchange',route);addEventListener('popstate',route);
